    <header>

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

            <a href="#">Головна</a>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>

<!--

1. У чому різниця між властивостями transition та animation?
Основна різниця між властивостями transition та animation полягає в їхній складності та логіці запуску. 
Transition забезпечує плавний перехід між двома станами елемента і обов'язково потребує зовнішнього тригера, наприклад, наведення курсору або зміни класу через JavaScript. 
Animation працює за допомогою ключових кадрів keyframes, що дозволяє створювати складні багатоетапні сценарії, які можуть запускатися автоматично, зациклюватися та мати безліч проміжних точок зміни властивостей незалежно від дій користувача.
2. Навіщо ми використовуємо transform: translate, а не margin-top для анімації руху? (Підказка: продуктивність).
Ми використовуємо властивість transform: translate замість зміни margin-top через значну різницю в продуктивності рендерингу сторінки. 
Зміна відступів margin змушує браузер щоразу перераховувати геометричне положення елемента та всього оточуючого макета, що викликає важкий процес Reflow. 
Трансформації ж обробляються окремим шаром за допомогою графічного прискорювача відеокарти (GPU), що не впливає на інші елементи і дозволяє досягти стабільної частоти 60 кадрів на секунду без візуальних затримок чи смикання інтерфейсу.
3. Який метод JS дозволяє додавати та видаляти клас одним рядком коду?
Для маніпуляції класами в мові JavaScript існує метод classList.toggle, який дозволяє додавати або видаляти клас усього одним рядком коду. 
Його логіка працює як перемикач: якщо вказаний клас уже присутній на елементі, метод його видаляє, а якщо клас відсутній — він буде автоматично доданий. 
Це значно спрощує написання коду для інтерактивних елементів, оскільки розробнику не потрібно писати довгі перевірки стану через умовні оператори if та else.
4. Як звернутися до другого елемента з трьох (наприклад, до середньої палички гамбургера) через CSS? (:nth-child(2)).
Щоб звернутися до другого елемента в групі однакових об'єктів у CSS, використовується спеціальний селектор :nth-child. 
Наприклад, конструкція .bar:nth-child(2) дозволяє вибрати саме середню лінію в структурі іконки гамбургера, не додаючи їй унікальних ідентифікаторів чи додаткових класів у HTML-код. 
Це робить структуру документа чистішою та дає можливість гнучко керувати трансформаціями кожної окремої частини складного об'єкта лише засобами каскадних таблиць стилів.
