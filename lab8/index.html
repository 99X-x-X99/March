<!--
1. Що означає абревіатура CSS?
CSS (Cascading Style Sheets) — це каскадні таблиці стилів, які використовуються для оформлення зовнішнього вигляду веб-сторінки (кольори, шрифти, відступи, розташування елементів).

2. Який пріоритет вищий: у стилю, прописаного в атрибуті style="...", чи у зовнішньому файлі?
Вищий пріоритет має стиль, прописаний безпосередньо в атрибуті style="..." (inline-стиль), ніж стилі у зовнішньому CSS-файлі.

3. Для чого використовується властивість padding, а для чого margin?
padding використовується для створення внутрішніх відступів (між вмістом елемента та його межами).
margin використовується для створення зовнішніх відступів (між елементами на сторінці).

4. Як звернутися до елемента з id="main" у CSS?
Щоб звернутися до елемента з id="main", потрібно використати символ #:
#main {
    /* стилі */
}

5. Як прибрати підкреслення у гіперпосилання?
Щоб прибрати підкреслення у посилання, використовується властивість text-decoration:
a {
    text-decoration: none;
}
-->
