<!--
1. Якщо ширина блоку 300px, padding: 20px, border: 5px:

content-box:
300 + 20 + 20 + 5 + 5 = 350px

border-box:
300px (все входить всередину)

2. Скорочений запис padding:
padding: 10px 20px;

3. Чи може margin бути від'ємним?
Так, може. Це дозволяє наближати або накладати елементи.

4. Чому margin: auto не центрує по вертикалі?
Тому що він працює тільки по горизонталі.
По вертикалі немає вільного простору для розподілу.
-->
