<!DOCTYPE html>
<html lang="uk">
<head>

<body class="d-flex flex-column min-vh-100">

    </header>

    <main>
        <div class="container mt-5">

            <div class="row">
                <div class="col-12 col-md-4 mb-4"> 
                    <div class="card h-100 shadow-sm"> 
                        <div class="card-body text-center">
                            <i class="fa-solid fa-code fa-3x text-primary mb-3"></i>
                            <h5 class="card-title">Розробка</h5>
                            <p class="card-text">Створення сайтів будь-якої складності.</p>
                            <a href="#" class="btn btn-primary">Детальніше</a>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4 mb-4"> 
                    <div class="card h-100 shadow-sm"> 
                        <div class="card-body text-center">
                            <i class="fa-solid fa-palette fa-3x text-success mb-3"></i>
                            <h5 class="card-title">Дизайн</h5>
                            <p class="card-text">Професійний UI/UX дизайн та верстка.</p>
                            <a href="#" class="btn btn-primary">Детальніше</a>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4 mb-4"> 
                    <div class="card h-100 shadow-sm"> 
                        <div class="card-body text-center">
                            <i class="fa-solid fa-magnifying-glass fa-3x text-info mb-3"></i>
                            <h5 class="card-title">SEO</h5>

        <div class="container text-center mt-5 mb-5">
            <h3>Інтерактивне SVG лого</h3>
            <svg class="my-svg-icon" width="100" height="100" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="#ffc107" />
            </svg>
        </div>
    </main>

    <footer class="mt-auto bg-dark text-white p-3 text-center">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!--

1. Скільки колонок має сітка Bootstrap? (12).
Стандартна сітка Bootstrap складається рівно з 12 колонок, що є базовою структурою для створення будь-якого адаптивного макета. 
Ця кількість обрана тому, що число 12 легко ділиться на 2, 3, 4 та 6, дозволяючи розробнику швидко створювати блоки різної ширини в межах одного рядка.
2. Що означає клас col-md-6? (На планшетах і ширше елемент займає 6 колонок, тобто 50% ширини).
Клас col-md-6 вказує браузеру, що на пристроях середнього розміру, таких як планшети, та на всіх екранах, що ширші за них, елемент повинен займати 6 колонок із 12 можливих. 
Фактично це означає, що блок буде розтягнутий рівно на 50% ширини батьківського контейнера, забезпечуючи зручне відображення контенту у два стовпці.
3. Як змінити колір SVG-елемента через CSS? (Властивість fill).
Щоб змінити колір SVG-елемента через CSS, використовується спеціальна властивість fill, яка відповідає за заповнення векторної фігури кольором. 
Важливо пам'ятати, що ця властивість працює лише тоді, коли SVG вставлений у HTML-код безпосередньо (inline), оскільки це дає стилям доступ до внутрішніх тегів об'єкта, таких як circle або path.
4. Які класи Bootstrap дозволяють швидко зробити текст жирним або змінити його колір на червоний? (fw-bold, text-danger).
Bootstrap містить набір готових утилітарних класів для швидкого оформлення тексту, серед яких клас fw-bold відповідає за встановлення жирного накреслення (font-weight: bold). 
Для того, щоб миттєво змінити колір тексту на червоний, використовується клас text-danger, який автоматично застосовує стандартний семантичний відтінок помилки, визначений у бібліотеці.
-->
